[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "village-docs"
version = "1.1.0"
description = "村务材料管理 Windows 桌面应用"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "python-docx>=1.1,<2",
  "docxcompose>=2.2,<3",
  "pypdf>=5,<7",
  "Pillow>=11,<13",
  "pillow-heif>=0.20,<2",
  "reportlab>=4.2,<5",
  "PyMuPDF>=1.25,<2",
  "send2trash>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
village-docs = "housebook.app:main"

[tool.setuptools.packages.find]
include = ["housebook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
